<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>MindFlow - 인터랙티브 마인드맵</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --text: #0f172a;
    --text-sub: #64748b;
    --border: #e2e8f0;
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --danger: #ef4444;
    --memo-bg: #fefce8;
    --memo-border: #fde047;
    --memo-accent: #ca8a04;
    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.08);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.12);
    --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.18);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: calc(54px + var(--safe-top));
    padding: var(--safe-top) 10px 0 10px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    z-index: 40;
  }

  .map-title-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    max-width: 44vw;
    cursor: pointer;
  }

  .map-title-btn span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .icon-btn:active {
    background: var(--border);
  }

  .icon-btn:disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  .layout-pill {
    height: 34px;
    padding: 0 9px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .layout-pill:active {
    background: var(--bg);
  }

  #canvas-viewport {
    position: fixed;
    top: calc(54px + var(--safe-top));
    bottom: calc(64px + var(--safe-bottom));
    left: 0;
    right: 0;
    overflow: hidden;
    touch-action: none;
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 22px 22px;
    cursor: grab;
  }

  #canvas-viewport:active {
    cursor: grabbing;
  }

  #world {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  #edges-svg {
    position: absolute;
    top: 0;
    left: 0;
    overflow: visible;
    pointer-events: none;
  }

  #nodes-layer {
    position: absolute;
    top: 0;
    left: 0;
  }

  .mm-node {
    position: absolute;
    transform: translate(-50%, -50%);
    min-width: 84px;
    max-width: 220px;
    padding: 9px 14px;
    border-radius: 14px;
    background: var(--surface);
    border: 2px solid #3b82f6;
    box-shadow: var(--shadow-sm);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    text-align: center;
    word-break: keep-all;
    overflow-wrap: break-word;
    cursor: pointer;
    touch-action: none;
    z-index: 2;
  }

  .mm-node.root {
    font-size: 16px;
    font-weight: 800;
    padding: 12px 20px;
    border-radius: 18px;
    color: #ffffff;
    box-shadow: var(--shadow-md);
  }

  .mm-node.selected {
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25), var(--shadow-md);
    z-index: 5;
  }

  .mm-node-text {
    pointer-events: none;
  }

  .collapse-badge {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #334155;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }

  .memo-badge-btn {
    position: absolute;
    top: -11px;
    right: -11px;
    width: 26px;
    height: 26px;
    border-radius: 999px;
    background: var(--memo-bg);
    border: 2px solid var(--memo-accent);
    color: #854d0e;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    z-index: 6;
    padding: 0;
  }

  .memo-badge-btn.open {
    background: var(--memo-accent);
    color: #ffffff;
  }

  .memo-bubble {
    position: absolute;
    width: 224px;
    background: var(--memo-bg);
    border: 1.5px solid #eab308;
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    z-index: 20;
    color: #422006;
    font-size: 12.5px;
    line-height: 1.45;
  }

  .memo-bubble-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    background: #fef08a;
    border-bottom: 1px solid #fde047;
    border-radius: 12px 12px 0 0;
